<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://tryattestly.com/" />

    <!-- Display face for the direct-response headlines; system fonts for body. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Distinctive, first-person-plural product copy so search engines and AI
         assistants bind this content to tryattestly.com, not a lookalike. -->
    <meta
      name="description"
      content="Attestly answers security questionnaires (SIG, CAIQ, VSAQ) for B2B SaaS. Every answer is drafted from your own SOC 2 and policies and cites the exact source line. In a 150-question test it kept false confidence under 1 percent. Start free at tryattestly.com."
    />
    <meta name="application-name" content="Attestly" />
    <meta name="author" content="Attestly" />

    <meta property="og:site_name" content="Attestly" />
    <meta property="og:title" content="Attestly — security questionnaires, answered with proof" />
    <meta
      property="og:description"
      content="Drafts each answer from your own SOC 2 and policies, cites the exact source line, and abstains instead of guessing. Under 1% false confidence across 150 questions. Start free at tryattestly.com."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://tryattestly.com/" />
    <meta property="og:image" content="https://tryattestly.com/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Attestly — security questionnaires, answered with proof" />
    <meta
      name="twitter:description"
      content="Answer SIG, CAIQ, and VSAQ questionnaires from your own SOC 2 and policies, with the exact source cited on every line. Start free."
    />
    <meta name="twitter:image" content="https://tryattestly.com/og.png" />
    <meta name="theme-color" content="#2563EB" />
    <title>Attestly — Security Questionnaires, Answered</title>

    <!-- Structured data: binds the brand + product to this domain for search/AI. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Attestly",
        "alternateName": "Attestly - security questionnaire automation",
        "url": "https://tryattestly.com/",
        "applicationCategory": "BusinessApplication",
        "applicationSubCategory": "Security questionnaire automation",
        "operatingSystem": "Web",
        "description": "Attestly answers security questionnaires (SIG, CAIQ, VSAQ, and custom spreadsheets) for B2B SaaS companies. Each answer is drafted from the company's own SOC 2 report and security policies, cites the exact source line, and abstains when the documents do not support a claim.",
        "featureList": [
          "Answers SIG, CAIQ, VSAQ and custom questionnaires",
          "Cites the exact source line for every answer",
          "Abstains instead of guessing when evidence is missing",
          "Reuses your approved answers across questionnaires",
          "Exports your own template, filled in, with source and status"
        ],
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD",
          "description": "Free tier: 150 answers to start, no credit card."
        },
        "publisher": {
          "@type": "Organization",
          "name": "Attestly",
          "url": "https://tryattestly.com/"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
